# First `conda env create -f conda_env_cosyvoice3.yml`
# Then install openai-whisper separately, with build isolation disabled:
#   pip install --no-build-isolation openai-whisper==20231117
# (its legacy setup.py needs pkg_resources at build time; pip's isolated build env fetches the
#  newest setuptools, which has dropped pkg_resources, so building it inline in this list fails.
#  --no-build-isolation reuses this env's setuptools==80.9.0, which still has it.)

